# Render Blueprint: depoyu Render'a bağlarken uygulamayı otomatik kurar.
# DATABASE_URL değerini (Neon bağlantı adresi) Render panelinde elle girmeniz gerekir, dosyaya yazılmaz.
services:
  - type: web
    name: kalfa
    runtime: node
    plan: free
    # Neon veri tabanıyla aynı bölge (Frankfurt): uygulama ile veri tabanı arasındaki gecikme düşük kalır.
    # Neon projesini başka bir bölgede açtıysanız burayı ona göre değiştirin (ohio, oregon, virginia, frankfurt, singapore).
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
