name: CI

on:
  push:
  pull_request:

jobs:
  # Sunucu testleri: API, güvenlik, çeviri bütünlüğü, kalıcılık ve Postgres yolu. Desteklenen Node sürümlerinde.
  server-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high

  # Tarayıcı testleri (Chromium): görünüm, form akışı, erişilebilirlik (axe), diller, tema, tekrar gönderim.
  # Zamanlamaya duyarlı olduğu için ilk çalıştırmalarda sonuç yalnızca bilgi verir (continue-on-error).
  # Birkaç çalıştırma temiz geçince bu satır kaldırılmalıdır.
  browser-tests:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: npm run test:e2e
